<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Colorful Login</title>
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <div class="background">

        <!-- Geometric shapes -->
        <div class="shape-left"></div>
        <div class="shape-bottom"></div>
        <div class="shape-right"></div>

        <!-- Login Form -->
        <div class="Login">
            <h2>Login</h2>
            <form>
                <div class="mb-3">
                    <label for="username" class="form-label px-4">Username</label>
                    <div class="input-align">
                        <i class="bi bi-person"></i>
                        <input type="text" class="form-control px-5" id="username" placeholder="Type Your username">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label px-4">Password</label>
                    <div class="input-align">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control px-5" id="password" placeholder="Type Your password">
                    </div>
                </div>
                <span class="forgot-password"><a href="#">Forgot Password?</a></span>
                <br>
                <button type="submit" class="button">LOGIN</button>
            </form>
            <p class="text-center position-absolute"
                style="top: 380px; left: 50%; transform: translateX(-50%); font-weight: bold;">Or signup using</p>
            <div class="social-icon">
                <a href="#"><i class="bi bi-facebook" target="_blank"></i></a>
                <a href="#"><i class="bi bi-twitter-x" target="_blank"></i></a>
                <a href="#"><i class="bi bi-google" target="_blank"></i></a>
            </div>
            <div class="footer">
                <small>have not account yet?</small>
            </div>
            <button id="button">SIGNUP</button>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
